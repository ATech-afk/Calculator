<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 260px;
        }
        #display {
            width: 100%;
            height: 45px;
            background: #1e293b;
            color: #fff;
            font-size: 1.4rem;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            background: #e2e8f0;
            border-radius: 6px;
            font-weight: bold;
        }
        button.operator { background: #f97316; color: white; }
        button.equal { background: #22c55e; color: white; grid-column: span 2; }
        button.clear { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="display.value=''">C</button>
        <button onclick="display.value+='/'" class="operator">/</button>
        <button onclick="display.value+='*'" class="operator">*</button>
        <button onclick="display.value+='-'" class="operator">-</button>
        
        <button onclick="display.value+='7'">7</button>
        <button onclick="display.value+='8'">8</button>
        <button onclick="display.value+='9'">9</button>
        <button onclick="display.value+='+'" class="operator">+</button>
        
        <button onclick="display.value+='4'">4</button>
        <button onclick="display.value+='5'">5</button>
        <button onclick="display.value+='6'">6</button>
        
        <button onclick="display.value+='1'">1</button>
        <button onclick="display.value+='2'">2</button>
        <button onclick="display.value+='3'">3</button>
        
        <button onclick="display.value+='0'">0</button>
        <button onclick="display.value+='.'">.</button>
        <button class="equal" onclick="try{display.value=eval(display.value)}catch{display.value='Error'}">=</button>
    </div>
</div>

</body>
</html>
